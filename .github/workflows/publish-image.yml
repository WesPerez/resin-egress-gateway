name: Test and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: resin-egress-gateway-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/wesperez/resin-egress-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.12
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 -shuffle=on ./...

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check that this run is still main HEAD
        id: main_head
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_head" == "$GITHUB_SHA" ]]; then
            echo 'promote=true' >>"$GITHUB_OUTPUT"
          else
            echo 'promote=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Promote immutable image to main
        if: steps.main_head.outputs.promote == 'true'
        run: >-
          docker buildx imagetools create
          --tag "${IMAGE_NAME}:main"
          "${IMAGE_NAME}:sha-${GITHUB_SHA}"
